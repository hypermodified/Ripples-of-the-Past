buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: project.property("forgegradle_version").toString(), changing: true
        classpath "org.parchmentmc:librarian:${project.property('librarian_version')}"
        classpath group: 'org.spongepowered', name: 'mixingradle', version: project.property("mixingradle_version").toString()
        classpath "${project.property('shadow_group')}:shadow:${project.property('shadow_version')}"
    }
}
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

version = release_snapshot.toBoolean() ? "${mc_version}-${mod_version}-snapshot-${snapshot_version}" : "${mc_version}-${mod_version}"
group = 'standobyte.jojo'
archivesBaseName = 'JJBA-RipplesOfThePast'

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.property("java_lang_version").toString()))

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
boolean useLegacyMixinRemap = project.property("use_legacy_mixin_remap").toString().toBoolean()
boolean enableLegacyReobfPipeline = project.property("enable_legacy_reobf_pipeline").toString().toBoolean()
String mappingsChannel = project.findProperty("mappings_channel")?.toString()?.trim() ?: 'parchment'
String mappingsVersion = project.findProperty("mappings_version")?.toString()?.trim()
if (!mappingsVersion) {
    mappingsVersion = project.property("parchment_version").toString()
}

minecraft {
    mappings channel: mappingsChannel, version: mappingsVersion
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (useLegacyMixinRemap) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                jojo {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (useLegacyMixinRemap) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                jojo {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', project.property('mod_id').toString(), '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                jojo {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


String portSourceIncludesRaw = project.findProperty("port_source_includes")?.toString()?.trim()
if (portSourceIncludesRaw) {
    List<String> portSourceIncludePatterns = portSourceIncludesRaw.split(';')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (!portSourceIncludePatterns.isEmpty()) {
        sourceSets.main.java.setIncludes(portSourceIncludePatterns)
        logger.lifecycle("Applying staged port source includes ({} patterns)", portSourceIncludePatterns.size())
    }
}

String portSourceExcludesRaw = project.findProperty("port_source_excludes")?.toString()?.trim()
if (portSourceExcludesRaw) {
    List<String> portSourceExcludePatterns = portSourceExcludesRaw.split(';')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (!portSourceExcludePatterns.isEmpty()) {
        sourceSets.main.java.exclude(portSourceExcludePatterns)
        logger.lifecycle("Applying staged port source excludes ({} patterns)", portSourceExcludePatterns.size())
    }
}


mixin {
    add sourceSets.main, 'mixins.jojo.refmap.json'
    config 'mixins.jojo.json'
    
    debug.verbose = true
    debug.export = true
    dumpTargetOnFailure = true
}

repositories {
    maven {
        name = "KosmX's maven"
        url = "https://maven.kosmx.dev/"
    }
//    flatDir {
//        dirs 'lib/dev/kosmx/player-anim/player-animation-lib-forge/0.4.0+1.16.5'
//        dirs 'lib/io/github/kosmx/bendy-lib/bendy-lib-forge/1.2.2'
//    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { // Vampirism
        name = "Maxanier"
        url = "https://maxanier.de/maven2/"
    }
    maven {
        name = "Expandability"
        url = "https://maven.florens.be/releases"
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${project.property('mixin_version')}:processor"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    boolean enableOptionalModDeps = project.property("enable_optional_mod_deps").toString().toBoolean()
    if (enableOptionalModDeps) {
        implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranim_version}")
        implementation fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}")

        compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}")
        compileOnly fg.deobf("de.teamlapen.vampirism:Vampirism:${mc_version}-${vampirism_version}")
        compileOnly fg.deobf("be.florens:expandability-forge:${expandability_version}")
    }

    shade 'team.unnamed:mocha:3.0.1'
}


// Minifies json resource files
import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import org.apache.tools.ant.filters.ReplaceTokens

processResources {
	inputs.property "version", project.version
    inputs.property "loader_version_range", project.property("loader_version_range")
    inputs.property "forge_version_range", project.property("forge_version_range")
    inputs.property "playeranim_version_range", project.property("playeranim_version_range")
    inputs.property "bendylib_version_range", project.property("bendylib_version_range")
    inputs.property "update_json_url", project.property("update_json_url")

    filesMatching("META-INF/mods.toml") {
        filter(ReplaceTokens, tokens: [
                loader_version_range: project.property("loader_version_range").toString(),
                forge_version_range: project.property("forge_version_range").toString(),
                playeranim_version_range: project.property("playeranim_version_range").toString(),
                bendylib_version_range: project.property("bendylib_version_range").toString(),
                update_json_url: project.property("update_json_url").toString()])
    }

    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
            File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}


jar {
	archiveClassifier = 'no-gecko'
    manifest {
        attributes([
            "Specification-Title": "Ripples of the Past",
            "Specification-Vendor": "StandoByte",
            "Specification-Version": "1", 
            "Implementation-Title": "com.github.standobyte.jojo",
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor" :"StandoByte",
        ])
    }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'team.unnamed.mocha', "dependency.${project.group}.mocha"
    exclude 'javassist*'
}

if (enableLegacyReobfPipeline) {
    shadowJar.finalizedBy 'reobfShadowJar'
    assemble.dependsOn shadowJar

    reobf {
        shadowJar {}
    }

    // Example configuration to allow publishing using the maven-publish task
    // This is the preferred method to reobfuscate your jar file
    jar.finalizedBy('reobfJar')
    // However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
    //publish.dependsOn('reobfJar')
}
else {
    logger.lifecycle('Legacy reobf pipeline disabled for migration profile.')
}

task srcJar (type: Jar) {
    from sourceSets.main.java
    archiveClassifier.set('sources')
}

if (enableLegacyReobfPipeline) {
    artifacts {
        archives srcJar
    }
}


tasks.withType(JavaCompile).configureEach {
    if (project.hasProperty('javac_maxerrs') && project.property('javac_maxerrs').toString().trim()) {
        options.compilerArgs += ['-Xmaxerrs', project.property('javac_maxerrs').toString()]
    }
    if (project.hasProperty('javac_maxwarns') && project.property('javac_maxwarns').toString().trim()) {
        options.compilerArgs += ['-Xmaxwarns', project.property('javac_maxwarns').toString()]
    }
}

tasks.withType(GenerateModuleMetadata) {
	// Gradle metadata generates with dependencies which causes an error, 
	// and I CBA to figure out how to fix it when this works
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version "${mc_version}-${mod_version}-snapshot-${snapshot_version}"
            from components.java
            artifact srcJar
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove dependencies from .pom
            }
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
