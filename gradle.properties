# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mc_version = 1.16.5
forge_version = 36.2.34
mod_version = 0.2.2.2
snapshot_version = 260128-a
release_snapshot = false
mod_id = jojo

playeranim_version = 0.4.0+1.16.5
bendylib_version = 1.2.2
jei_version = 7.8.0.1009
vampirism_version = 1.8.3
expandability_version = 2.0.1

# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10808

# Build config knobs (used by build.gradle)
java_lang_version = 8
parchment_version = 2022.03.06-1.16.5

# 1.20.1 bootstrap reference values (apply on a dedicated port branch)
# mc_version = 1.20.1
# forge_version = 47.2.0
# java_lang_version = 17
# parchment_version = 2023.09.03-1.20.1

loader_version_range = [36,)
forge_version_range = [36.2.20,)

# Mapping knobs for staged migration
mappings_channel = parchment
mappings_version = 2022.03.06-1.16.5
# 1.20.1 option (FG6 bootstrap):
# mappings_channel = official
# mappings_version = 1.20.1

# 1.20.1 metadata reference values
# loader_version_range = [47,)
# forge_version_range = [47.2.0,)

# Toggle third-party mod integrations on build classpath (useful for early port bootstrap)
enable_optional_mod_deps = true
# enable_optional_mod_deps = false

# Optional dependency version ranges for mods.toml tokenization
playeranim_version_range = [0.4.0+1.16.5]
bendylib_version_range = [1.2.1,)

# 1.20.1 optional dependency reference values
# playeranim_version_range = [1.0.2+1.20]
# bendylib_version_range = [1.2.6,)


# Gradle plugin versions (parameterized for staged migration)
forgegradle_version = 5.1.+
librarian_version = 1.+
mixingradle_version = 0.7-SNAPSHOT
shadow_version = 7.1.2
shadow_group = gradle.plugin.com.github.johnrengelman

# 1.20.1 plugin reference values (adjust as needed during active migration)
# forgegradle_version = 6.0.+
# librarian_version = 1.+
# mixingradle_version = 0.7-SNAPSHOT
# shadow_version = 8.1.1
# shadow_group = com.github.johnrengelman
# note: Shadow 8.x requires Gradle 8+, so migrate wrapper first.


# Legacy run config mixin remap toggles (disable for modern ForgeGradle 6+/1.20.1)
use_legacy_mixin_remap = true
# use_legacy_mixin_remap = false

# Legacy packaging/reobf wiring toggle (FG5-era pipeline)
enable_legacy_reobf_pipeline = true
# enable_legacy_reobf_pipeline = false

# Mixin artifact version (parameterized for migration)
mixin_version = 0.8.4
# mixin_version = 0.8.5

update_json_url = https://raw.githubusercontent.com/StandoByte/Ripples-of-the-Past/1.16.5-0.2.2/update.json
# 1.20.1 metadata reference value
# update_json_url = https://raw.githubusercontent.com/StandoByte/Ripples-of-the-Past/1.20.1/update.json


