name: Build Test JAR

on:
  workflow_dispatch:
  push:
    branches:
      - work
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/run-local-checks.sh'
      - 'porting/gradle-1.20.1-packet-manager-slice.properties'
      - '.github/workflows/build-test-jar.yml'

jobs:
  build-test-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Print dispatch context
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "Workflow always checks out branch: work"

      - name: Checkout porting branch (work)
        uses: actions/checkout@v4
        with:
          ref: work

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'porting/gradle-1.20.1-packet-manager-slice.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build test JAR (minimal packet-manager profile)
        run: |
          chmod +x gradlew scripts/run-local-checks.sh
          PORT_BUILD_JAR_TIMEOUT_SECONDS=1800 bash scripts/run-local-checks.sh --port-1201-build-jar --port-profile porting/gradle-1.20.1-packet-manager-slice.properties

      - name: Verify built JAR contains updated playeranimator dependency range
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(ls build/libs/*.jar | head -n1)"
          unzip -p "$jar_path" META-INF/mods.toml > /tmp/mods.toml.from.jar
          if ! grep -q 'modId="playeranimator"' /tmp/mods.toml.from.jar; then
            echo "::error::playeranimator dependency block missing from built jar mods.toml"
            exit 1
          fi
          if ! grep -q 'versionRange="[0,)"' /tmp/mods.toml.from.jar; then
            echo "::error::Built jar does not contain expected relaxed playeranimator range [0,)"
            exit 1
          fi
          {
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "jar=$jar_path"
            echo "playeranimator_range=[0,)"
          } > build/libs/build-metadata.txt

      - name: Upload test JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ripples-test-jar-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/build-metadata.txt
          if-no-files-found: error
